name: Opet Fiyat Guncelleyici

on:
  schedule:
    # Her gece Türkiye saati ile 01:30 (UTC 22:30)
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fuel:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Ortamını Hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Paketleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fiyat Scriptini Çalıştır
        run: |
          cd UstunbusTravelWisard/projectlibraries
          python update_prices.py

      - name: Değişiklikleri Commit ve Push Yap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Oluşan veya güncellenen tüm dosyaları (prices.json vb.) ekle
          git add -A
          
          if git diff --staged --quiet; then
            echo "Fiyatlarda değişiklik yok, commit atlanıyor."
            exit 0
          fi
          
          git commit -m "chore(data): Opet anlık akaryakıt fiyatları güncellendi [skip ci]"
          
          # Aktif branch'e güvenli token ile push et
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:${CURRENT_BRANCH}