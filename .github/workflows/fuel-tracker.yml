name: Opet Fiyat Guncelleyici

on:
  schedule:
    # Her akşam Türkiye saati ile 21:35 (UTC 18:35)
    - cron: '35 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fuel:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Python Ortamını Hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Paketleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fiyat Scriptini Çalıştır
        run: |
          cd UstunbusTravelWisard
          python update_prices.py

      - name: Değişiklikleri Commit ve Push Yap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add UstunbusTravelWisard/prices.json
          if git diff --staged --quiet; then
            echo "Fiyatlarda değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore(data): Opet anlık akaryakıt fiyatları güncellendi [skip ci]"
            git push origin main
          fi