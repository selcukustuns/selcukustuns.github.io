<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üstünbus Turizm Resmi Kimlik Doğrulama Sistemi</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #3f519b 0%, #3e9a3b 50%, #f5ad0b 100%);
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 25px 20px; 
        }

        .top-navbar {
            width: 100%;
            max-width: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 25px;
            background: transparent;
        }

        .logo-ustunbus {
            max-width: 300px;
            width: 85%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
        }

        .container { 
            background: rgba(255, 255, 255, 0.16); 
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            width: 100%; 
            max-width: 420px; 
            border-radius: 18px; 
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28); 
            overflow: hidden; 
        }
        
        .card-header { 
            background: #102a43; 
            color: #ffffff; 
            text-align: center; 
            padding: 20px; 
            font-weight: 800; 
            letter-spacing: 1.5px; 
            font-size: 15px; 
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
        }

        .content { 
            padding: 25px 24px 30px 24px; 
            text-align: center; 
            min-height: 410px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        
        .loader-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .loader { 
            border: 4px solid rgba(255, 255, 255, 0.2); 
            border-top: 4px solid #ffffff; 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 1s linear infinite; 
            margin-bottom: 20px; 
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        .hidden { display: none !important; }
        
        .profile-img { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid rgba(255, 255, 255, 0.85); 
            margin: 0 auto 15px auto; 
            box-shadow: 0 6px 14px rgba(0,0,0,0.2); 
        }

        /* Pop-Up Rozet Alanı */
        .badge-wrapper {
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .status-badge { 
            display: inline-flex; 
            align-items: center; 
            padding: 9px 22px; 
            border-radius: 24px; 
            font-weight: 700; 
            font-size: 14px; 
            opacity: 0;
            transform: scale(0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .status-badge.show-popup {
            opacity: 1;
            transform: scale(1);
        }

        /* Tam Canlı Yeşil Tik Rengi */
        .status-valid { 
            background: #10b981; 
            color: #ffffff; 
            border: 1.5px solid #a7f3d0; 
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.55);
            letter-spacing: 0.3px;
        }

        .status-invalid { 
            background: rgba(220, 38, 38, 0.95); 
            color: #ffffff; 
            border: 1px solid rgba(255, 255, 255, 0.5); 
            box-shadow: 0 6px 18px rgba(220, 38, 38, 0.55);
        }
        
        .info-container { width: 100%; text-align: left; }
        
        .info-group { 
            margin-bottom: 12px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.2); 
            padding-bottom: 8px; 
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .info-group.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .info-group:last-child { border-bottom: none; }
        
        .info-label { 
            font-size: 11px; 
            color: rgba(255, 255, 255, 0.75); 
            text-transform: uppercase; 
            font-weight: 700; 
            letter-spacing: 0.8px; 
        }

        .info-value { 
            font-size: 15px; 
            color: #ffffff; 
            font-weight: 600; 
            margin-top: 4px; 
            text-shadow: 0 1px 2px rgba(0,0,0,0.25);
        }
        
        .footer { 
            background: rgba(0, 0, 0, 0.15); 
            text-align: center; 
            padding: 16px 20px; 
            font-size: 11px; 
            color: rgba(255, 255, 255, 0.85); 
            border-top: 1px solid rgba(255, 255, 255, 0.15); 
            line-height: 1.6;
        }

        .bottom-logo-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 25px;
            background: transparent;
        }

        .logo-turkiyesenin-outside {
            max-width: 220px;
            width: 65%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
        }
    </style>
</head>
<body>

    <header class="top-navbar">
        <img src="ustunbuswhite.png" alt="Üstünbus Turizm Logo" class="logo-ustunbus">
    </header>

    <main class="container">
        <div class="card-header">
            PERSONEL DOĞRULAMA SİSTEMİ
        </div>
        
        <div class="content" id="loading-section">
            <div class="loader-container">
                <div class="loader"></div>
                <p style="color: #ffffff; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.3);">Sistem taranıyor...</p>
                <p style="color: rgba(255,255,255,0.75); font-size: 12px; margin-top: 5px;">Lütfen bekleyiniz</p>
            </div>
        </div>

        <div class="content hidden" id="result-section">
            <img id="user-photo" src="" alt="Profil Fotoğrafı" class="profile-img">
            
            <div class="badge-wrapper">
                <span id="status-badge" class="status-badge"></span>
            </div>
            
            <div class="info-container">
                <div class="info-group" id="row-name">
                    <div class="info-label">Ad Soyad</div>
                    <div class="info-value" id="user-name">-</div>
                </div>
                <div class="info-group" id="row-tc">
                    <div class="info-label">T.C. Kimlik No</div>
                    <div class="info-value" id="user-tc">-</div>
                </div>
                <div class="info-group" id="row-title">
                    <div class="info-label">Unvan / Görev</div>
                    <div class="info-value" id="user-title">-</div>
                </div>
                <div class="info-group" id="row-sicil">
                    <div class="info-label">Sicil / Belge No</div>
                    <div class="info-value" id="user-sicil">-</div>
                </div>
                <div class="info-group" id="row-expire">
                    <div class="info-label">Geçerlilik Tarihi</div>
                    <div class="info-value" id="user-expire">-</div>
                </div>
            </div>
        </div>
        
        <footer class="footer">
            Sistem Saati: <span id="current-time"></span><br>
            Bu sayfa yetkisiz erişime karşı korunmaktadır.
        </footer>
    </main>

    <div class="bottom-logo-container">
        <img src="turkiyesenin.png" alt="Türkiye Senin Logo" class="logo-turkiyesenin-outside">
    </div>

    <script>
        const originalTitle = 'Üstünbus Turizm Resmi Kimlik Doğrulama Sistemi';
        document.title = originalTitle;

        let marqueeInterval = null;
        let isVerificationStarted = false;

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                let alertText = '⚠️ Doğrulamayı Kaçırma !  ---  ';
                if (!marqueeInterval) {
                    marqueeInterval = setInterval(() => {
                        alertText = alertText.substring(1) + alertText.substring(0, 1);
                        document.title = alertText;
                    }, 250);
                }
            } else {
                clearInterval(marqueeInterval);
                marqueeInterval = null;
                document.title = originalTitle;

                if (!isVerificationStarted) {
                    startVerification();
                }
            }
        });

        const timeElement = document.getElementById('current-time');
        setInterval(() => {
            const now = new Date();
            timeElement.innerText = now.toLocaleString('tr-TR');
        }, 1000);

        const urlParams = new URLSearchParams(window.location.search);
        const queryId = urlParams.get('id');

        const database = {
            'GB2030': {
                name: 'Günseli Beydüz',
                tc: '2*86***8**6',
                title: 'Acenta Görevlisi',
                sicilNo: 'UST-94285-B',
                expire: '31.12.2030', 
                status: 'valid',
                photo: 'UST-94285-B.jpeg'
            }
        };

        function startVerification() {
            isVerificationStarted = true;

            setTimeout(() => {
                document.getElementById('loading-section').classList.add('hidden');
                const resultSection = document.getElementById('result-section');
                resultSection.classList.remove('hidden');

                const user = database[queryId];
                const badge = document.getElementById('status-badge');

                if (user && user.status === 'valid') {
                    document.getElementById('user-photo').src = user.photo;

                    // 1. İsim gelir
                    document.getElementById('user-name').innerText = user.name;
                    document.getElementById('row-name').classList.add('visible');

                    // 2. T.C. Kimlik gelir
                    setTimeout(() => {
                        document.getElementById('user-tc').innerText = user.tc;
                        document.getElementById('row-tc').classList.add('visible');
                    }, 250);

                    // 3. Unvan gelir
                    setTimeout(() => {
                        document.getElementById('user-title').innerText = user.title;
                        document.getElementById('row-title').classList.add('visible');
                    }, 500);

                    // 4. Sicil No gelir
                    setTimeout(() => {
                        document.getElementById('user-sicil').innerText = user.sicilNo;
                        document.getElementById('row-sicil').classList.add('visible');
                    }, 750);

                    // 5. Geçerlilik Tarihi gelir
                    setTimeout(() => {
                        document.getElementById('user-expire').innerText = user.expire;
                        document.getElementById('row-expire').classList.add('visible');
                    }, 1000);

                    // 6. En son Geçerli Kimlik Kartı ✅ Pop-Up olarak fırlar
                    setTimeout(() => {
                        badge.className = 'status-badge status-valid show-popup';
                        badge.innerText = 'Geçerli Kimlik Kartı ✅';
                    }, 1250);

                } else {
                    document.getElementById('user-photo').style.display = 'none';
                    document.getElementById('user-name').innerText = 'KAYIT BULUNAMADI';
                    document.getElementById('row-name').classList.add('visible');
                    document.getElementById('user-sicil').innerText = queryId || 'Parametre Eksik';
                    document.getElementById('row-sicil').classList.add('visible');
                    
                    badge.className = 'status-badge status-invalid show-popup';
                    badge.innerText = 'Geçersiz / Sahte Kimlik Kartı ✕';
                }
            }, 1200); 
        }

        if (!document.hidden) {
            startVerification();
        }
    </script>
</body>
</html>
