<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKES - Canlı Tur Kayıt Test Paneli</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --dark: #0f172a;
            --border: #cbd5e1;
            --bg: #f8fafc;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 30px 15px;
            color: #334155;
        }
        .container {
            max-width: 620px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
            border: 1px solid #e2e8f0;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }
        h2 { margin: 0; color: var(--dark); font-size: 20px; }
        .badge-live {
            background: #dcfce7;
            color: #15803d;
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #bbf7d0;
        }
        label {
            display: block;
            margin-top: 13px;
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 14px;
        }
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 560px) { .row-2 { grid-template-columns: 1fr; } }
        .btn-submit {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-submit:hover { background: var(--primary-hover); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-box {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🚌 YKES - Tur Kayıt Sistemi (CORS Korumalı)</h2>
        <span class="badge-live">● Canlı Test</span>
    </div>

    <!-- 1. HEDEF TUR DOSYASI -->
    <label for="turSecim">📁 Klasördeki Tur Dosyası:</label>
    <select id="turSecim">
        <option value="">⏳ Klasör taranıyor, lütfen bekleyin...</option>
    </select>

    <!-- 2. KOLTUK VE TC -->
    <div class="row-2">
        <div>
            <label for="koltukNo">Koltuk No:</label>
            <input type="text" id="koltukNo" value="12">
        </div>
        <div>
            <label for="tcKimlik">T.C. Kimlik / Pasaport:</label>
            <input type="text" id="tcKimlik" maxlength="11" value="12345678901">
        </div>
    </div>

    <!-- 3. AD SOYAD VE TELEFON -->
    <div class="row-2">
        <div>
            <label for="adSoyad">Yolcu Adı Soyadı:</label>
            <input type="text" id="adSoyad" value="Ahmet Yılmaz">
        </div>
        <div>
            <label for="telefon">Telefon No:</label>
            <input type="text" id="telefon" value="05321234567">
        </div>
    </div>

    <!-- 4. ÖDENEN VE KALAN TUTAR -->
    <div class="row-2">
        <div>
            <label for="odenen">Ödenen Kapora (₺):</label>
            <input type="number" id="odenen" value="1500">
        </div>
        <div>
            <label for="kalanBorc">Kalan Borç (₺):</label>
            <input type="number" id="kalanBorc" value="1000">
        </div>
    </div>

    <!-- 5. BİNİŞ DURAĞI -->
    <label for="binisDuragi">Biniş Durağı:</label>
    <select id="binisDuragi">
        <option value="Mersin - Vipol">Mersin - Vipol</option>
        <option value="Tarsus - Ofis" selected>Tarsus - Ofis</option>
        <option value="Adana - Duygu Kafe">Adana - Duygu Kafe</option>
    </select>

    <label for="notAciklama">Özel İstek / Not:</label>
    <input type="text" id="notAciklama" value="Web Test Kaydı">

    <button type="button" class="btn-submit" id="btnGonder" onclick="kayitGonder()">
        🚀 Kriptola ve Tur Dosyasına Yaz
    </button>

    <div id="durumKutusu" class="status-box"></div>
</div>

<script>
    const KOPRU_API_URL = "https://script.google.com/macros/s/AKfycbw6u2YRyvbRbBwt84ovzi5oSBypsoHvGmsdnukwyVa4Nud5CRXsYltb9XgZ0ODfvMyM/exec";
    const GIZLI_ANAHTAR = "UstunbusSecretKey2026";

    function metniSifrele(acikMetin, anahtar) {
        if (!acikMetin) return "";
        const utf8Metin = unescape(encodeURIComponent(acikMetin));
        let xorlanmis = "";
        for (let i = 0; i < utf8Metin.length; i++) {
            xorlanmis += String.fromCharCode(utf8Metin.charCodeAt(i) ^ anahtar.charCodeAt(i % anahtar.length));
        }
        return btoa(xorlanmis);
    }

    function bildirimGoster(mesaj, renk, arkaplan, kenarlik) {
        const durum = document.getElementById("durumKutusu");
        durum.style.display = "block";
        durum.style.color = renk;
        durum.style.background = arkaplan;
        durum.style.border = "1px solid " + kenarlik;
        durum.innerHTML = mesaj;
    }

    // CORS Engelini Aşarak Veri Çeken Motor (app.js ile aynı mantık)
    async function engelsizGetIstegi(hedefUrl) {
        try {
            const r1 = await fetch(hedefUrl, { redirect: "follow" });
            if (r1.ok) {
                const t1 = await r1.text();
                return JSON.parse(t1);
            }
        } catch(e) {}

        // Doğrudan istek başarısızsa Proxy köprüsünü devreye sok
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(hedefUrl)}&timestamp=${Date.now()}`;
        const r2 = await fetch(proxyUrl);
        if (!r2.ok) throw new Error("Proxy bağlantısı kurulamadı.");
        const data = await r2.json();
        return JSON.parse(data.contents);
    }

    // Klasördeki turları otomatik yükle
    window.onload = async function() {
        const select = document.getElementById("turSecim");
        try {
            const data = await engelsizGetIstegi(KOPRU_API_URL);
            if (data.success && data.turlar && data.turlar.length > 0) {
                select.innerHTML = "";
                data.turlar.forEach(tur => {
                    const opt = document.createElement("option");
                    opt.value = tur.dosyaId;
                    opt.textContent = "📄 " + tur.dosyaAdi;
                    select.appendChild(opt);
                });
            } else if (data.success) {
                select.innerHTML = "<option value=''>⚠️ Klasörde Excel/E-Tablo bulunamadı.</option>";
            } else {
                select.innerHTML = `<option value=''>❌ Hata: ${data.error}</option>`;
            }
        } catch (err) {
            console.error(err);
            select.innerHTML = "<option value=''>❌ Bağlantı hatası: Tarayıcı engeli aşılamadı.</option>";
        }
    };

    // Kayıt Gönderme
    async function kayitGonder() {
        const btn = document.getElementById("btnGonder");
        const dosyaId = document.getElementById("turSecim").value;

        if (!dosyaId) {
            alert("Lütfen önce bir tur dosyası seçin!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "⏳ Kayıt İletiliyor...";
        bildirimGoster("⏳ Veri kriptolanıyor ve hedef tur dosyasına işleniyor...", "#1e40af", "#eff6ff", "#bfdbfe");

        const paket = {
            dosyaId: dosyaId,
            koltukNo: document.getElementById("koltukNo").value.trim(),
            tcKimlik: document.getElementById("tcKimlik").value.trim(),
            adSoyad: document.getElementById("adSoyad").value.trim(),
            telefon: document.getElementById("telefon").value.trim(),
            odenen: document.getElementById("odenen").value,
            kalanBorc: document.getElementById("kalanBorc").value,
            binisDuragi: document.getElementById("binisDuragi").value,
            not: document.getElementById("notAciklama").value.trim()
        };

        const sifreliPayload = metniSifrele(JSON.stringify(paket), GIZLI_ANAHTAR);

        try {
            const res = await fetch(KOPRU_API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ payload: sifreliPayload })
            });

            const sonuc = await res.json();
            if (sonuc.success) {
                bildirimGoster(`✅ <strong>Başarılı:</strong> ${sonuc.message}`, "#166534", "#f0fdf4", "#bbf7d0");
            } else {
                bildirimGoster(`❌ <strong>Hata:</strong> ${sonuc.error}`, "#b91c1c", "#fef2f2", "#fecaca");
            }
        } catch (err) {
            bildirimGoster(`❌ <strong>Bağlantı Hatası:</strong> ${err.message}`, "#b91c1c", "#fef2f2", "#fecaca");
        } finally {
            btn.disabled = false;
            btn.innerText = "🚀 Kriptola ve Tur Dosyasına Yaz";
        }
    }
</script>

</body>
</html>
