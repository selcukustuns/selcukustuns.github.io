<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yolcu Kayıt Etme Sistemi (YKES)</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --dark: #0f172a;
            --border: #cbd5e1;
            --bg: #f8fafc;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px 15px;
            color: #334155;
        }
        .main-container {
            max-width: 1260px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        h2 { margin: 0; color: var(--dark); font-size: 20px; }
        .tour-select-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 20px;
        }
        .split-layout {
            display: grid;
            grid-template-columns: 430px 1fr;
            gap: 25px;
            align-items: start;
        }
        @media (max-width: 950px) {
            .split-layout { grid-template-columns: 1fr; }
        }
        select, input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
        }
        .bus-wrapper {
            background: #fff;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 15px;
        }
        .bus-cabin {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #e2e8f0;
        }
        .bus-front {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px dashed #cbd5e1;
            font-size: 12px;
            font-weight: 800;
            color: #475569;
        }
        .legend-box {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            font-size: 11px;
            font-weight: 700;
        }
        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
        }
        .orta-kapi-blok {
            grid-column: span 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
            border: 2px dashed #94a3b8;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 900;
            color: #334155;
            padding: 8px 6px;
        }
        .passenger-card {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .passenger-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 800;
            font-size: 13px;
            color: #1e40af;
        }
        .btn-submit {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            background: var(--success);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-submit:hover:not(:disabled) { background: #15803d; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .status-box {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header">
        <h2>🚌 Yolcu Kayıt Etme Sistemi (YKES)</h2>
        <span style="background:#dcfce7; color:#15803d; padding:4px 10px; border-radius:15px; font-size:12px; font-weight:bold;">● Başarıyla Bağlandı</span>
    </div>

    <!-- TUR SEÇİMİ -->
    <div class="tour-select-box">
        <label for="turSecimi" style="display:block; font-size:13px; font-weight:700; color:#1e40af; margin-bottom:6px;">
            📁 İŞLEM YAPILACAK TURU SEÇİN:
        </label>
        <div style="display:flex; gap:10px;">
            <select id="turSecimi" onchange="turSecildi()" style="background:#fff; flex:1;">
                <option value="">⏳ Turlar taranıyor...</option>
            </select>
            <button type="button" onclick="turlariYukle()" style="padding:8px 16px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">🔄 Yenile</button>
        </div>
    </div>

    <div class="split-layout">
        
        <!-- SOL: DİNAMİK ARAÇ ŞEMASI -->
        <div class="bus-wrapper">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:8px; margin-bottom:10px;">
                <span id="aracTipiBaslik" style="font-weight:bold; font-size:13.5px; color:var(--dark);">🚐 Araç Şeması</span>
                <span id="koltukSayac" style="font-size:12px; font-weight:700; color:#16a34a;">0 Boş</span>
            </div>

            <div class="legend-box">
                <span class="legend-item" style="background:#ffd1dc; color:#831843; border-color:#f472b6;">🎨 Grup Renkleri</span>
                <span class="legend-item" style="background:#fce7f3; color:#be185d; border-color:#fbcfe8;">👩 Kadın</span>
                <span class="legend-item" style="background:#e0f2fe; color:#0369a1; border-color:#bae6fd;">👨 Erkek</span>
                <span class="legend-item" style="background:#ffffff; color:#15803d; border-color:#86efac;">✅ Boş Koltuk</span>
            </div>

            <div class="bus-cabin">
                <div class="bus-front">
                    <span>💺 KAPTAN</span>
                    <span style="background:#e2e8f0; padding:3px 8px; border-radius:4px; font-size:11px;">🚪 ÖN KAPI</span>
                </div>
                
                <div id="krokiAlani" style="display:flex; flex-direction:column; gap:6px;">
                    <div style="text-align:center; padding:30px 10px; color:#64748b; font-size:13px;">Lütfen bir tur seçiniz.</div>
                </div>
            </div>
        </div>

        <!-- SAĞ: ÇOKLU YOLCU FORMU -->
        <div style="background:#fff; border:1px solid #cbd5e1; border-radius:12px; padding:18px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3 style="margin:0; font-size:15px; color:var(--primary);">
                    👥 Seçilen Koltuklar (<span id="seciliSayac">0</span> Kişi)
                </h3>
                <button type="button" onclick="secimleriTemizle()" style="font-size:11px; padding:4px 8px; background:#f1f5f9; border:1px solid #cbd5e1; border-radius:4px; cursor:pointer;">Seçimi Temizle</button>
            </div>

            <!-- Toplu Durak ve Hızlı Telefon Doldurma -->
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:12px; background:#eff6ff; padding:10px; border-radius:6px; border:1px solid #bfdbfe;">
                <div>
                    <span style="font-size:11.5px; font-weight:bold; color:#1e40af; display:block; margin-bottom:3px;">Gruba Ortak Durak:</span>
                    <select id="topluDurakSecici" onchange="topluDurakUygula()" style="padding:6px; font-size:12px;">
                        <option value="">Seçiniz...</option>
                        <option value="Mersin - Vipol">Mersin - Vipol</option>
                        <option value="Mersin - Forum">Mersin - Forum</option>
                        <option value="Mersin - Eski Devlet Hastanesi">Mersin - Eski Devlet Hastanesi</option>
                        <option value="Tarsus - Ofis">Tarsus - Ofis</option>
                        <option value="Tarsus - Madame Home">Tarsus - Madame Home</option>
                        <option value="Tarsus - Cengiz Topel">Tarsus - Cengiz Topel</option>
                        <option value="Tarsus - Kleopatra">Tarsus - Kleopatra</option>
                        <option value="Adana - Duygu Kafe">Adana - Duygu Kafe</option>
                    </select>
                </div>
                <div>
                    <span style="font-size:11.5px; font-weight:bold; color:#1e40af; display:block; margin-bottom:3px;">Gruba Ortak Tel No:</span>
                    <input type="text" id="topluTelInput" placeholder="0532..." onkeyup="topluTelUygula()" style="padding:6px; font-size:12px;">
                </div>
            </div>

            <div id="yolcuListesiFormu" style="max-height: 480px; overflow-y:auto; padding-right:5px;">
                <div style="text-align:center; padding:30px 10px; color:#94a3b8; font-size:13px;">
                    Henüz koltuk seçilmedi. Soldaki şemadan boş koltuklara tıklayın.
                </div>
            </div>

            <button type="button" id="btnKaydet" onclick="grubuKaydet()" class="btn-submit" disabled>
                💾 Yolcuyu Kaydet
            </button>

            <div id="durumKutusu" class="status-box"></div>
        </div>

    </div>
</div>

<script>
    const API_BASE = "https://ykes-drive-bridge.vercel.app";
    let aktifDosyaId = null;
    let aktifKapasiteTipi = 46;
    let mevcutKoltukListesi = [];
    let seciliKoltuklar = [];

    async function turlariYukle() {
        const select = document.getElementById("turSecimi");
        select.innerHTML = '<option value="">⏳ Turlar taranıyor...</option>';

        try {
            const res = await fetch(`${API_BASE}/api/turlar`);
            const data = await res.json();
            if (!data.success) throw new Error(data.hata);

            select.innerHTML = '<option value="">-- Lütfen Bir Tur Seçiniz --</option>';

            const gruplar = {};
            data.dosyalar.forEach(d => {
                const k = d.klasor || "Ana Dizin";
                if (!gruplar[k]) gruplar[k] = [];
                gruplar[k].push(d);
            });

            for (const [kategori, dosyalar] of Object.entries(gruplar)) {
                const group = document.createElement("optgroup");
                group.label = `📁 ${kategori}`;
                dosyalar.forEach(d => {
                    const opt = document.createElement("option");
                    opt.value = d.id;
                    opt.innerText = d.name;
                    group.appendChild(opt);
                });
                select.appendChild(group);
            }
        } catch (err) {
            select.innerHTML = `<option value="">❌ Hata: ${err.message}</option>`;
        }
    }

    async function turSecildi() {
        const select = document.getElementById("turSecimi");
        aktifDosyaId = select.value;
        seciliKoltuklar = [];
        yolcuFormunuYenile();
        if (!aktifDosyaId) return;

        bildirimGoster("⏳ Tur ve koltuk durumu yükleniyor...", "#0369a1", "#eff6ff", "#bfdbfe");

        try {
            const res = await fetch(`${API_BASE}/api/tur-detay?id=${aktifDosyaId}`);
            const data = await res.json();
            if (!data.success) throw new Error(data.hata);

            aktifKapasiteTipi = 46;
            data.sayfalar.forEach(s => {
                if (s.sayfa_adi.includes("41")) aktifKapasiteTipi = 41;
                if (s.sayfa_adi.includes("54")) aktifKapasiteTipi = 54;
            });

            document.getElementById("aracTipiBaslik").innerText = `🚐 ${aktifKapasiteTipi} Kişilik ${aktifKapasiteTipi === 41 ? '(2+1 VIP)' : '(2+2)'}`;

            const krokiSayfa = data.sayfalar.find(s => s.sayfa_adi.includes(String(aktifKapasiteTipi))) || data.sayfalar[0];
            const uedtsSayfa = data.sayfalar.find(s => s.sayfa_adi.includes("UEDTS") || s.sayfa_adi.includes("UETDS"));

            const cinsiyetler = {};
            if (uedtsSayfa && uedtsSayfa.satirlar) {
                uedtsSayfa.satirlar.forEach((satir, idx) => {
                    if (idx >= 2) {
                        const kNo = idx - 1;
                        const cVal = String(satir[4]?.deger || '').trim().toUpperCase();
                        if (cVal === 'K' || cVal.includes('KADIN')) cinsiyetler[kNo] = 'K';
                        else if (cVal === 'E' || cVal.includes('ERKEK')) cinsiyetler[kNo] = 'E';
                    }
                });
            }

            const KROKI_HUC_46 = {
                1: [17, 0], 2: [17, 1], 3: [17, 3], 4: [17, 4],
                5: [20, 0], 6: [20, 1], 7: [20, 3], 8: [20, 4],
                9: [23, 0], 10: [23, 1], 11: [23, 3], 12: [23, 4],
                13: [26, 0], 14: [26, 1], 15: [26, 3], 16: [26, 4],
                17: [29, 0], 18: [29, 1], 19: [29, 3], 20: [29, 4],
                21: [32, 0], 22: [32, 1],
                23: [35, 3], 24: [35, 4], 25: [35, 0], 26: [35, 1],
                27: [38, 3], 28: [38, 4], 29: [38, 0], 30: [38, 1],
                31: [41, 3], 32: [41, 4], 33: [41, 0], 34: [41, 1],
                35: [44, 3], 36: [44, 4], 37: [44, 0], 38: [44, 1],
                39: [47, 3], 40: [47, 4], 41: [47, 0], 42: [47, 1],
                43: [50, 3], 44: [50, 4], 45: [50, 0], 46: [50, 1]
            };
            const KROKI_HUC_41 = {
                1: [17, 0], 2: [17, 2], 3: [17, 3],
                4: [20, 0], 5: [20, 2], 6: [20, 3],
                7: [23, 0], 8: [23, 2], 9: [23, 3],
                10: [26, 0], 11: [26, 2], 12: [26, 3],
                13: [29, 0], 14: [29, 2], 15: [29, 3],
                16: [32, 0], 17: [32, 2], 18: [32, 3],
                19: [35, 0], 20: [35, 2], 21: [35, 3],
                22: [38, 0],
                23: [41, 0], 24: [41, 2], 25: [41, 3],
                26: [44, 0], 27: [44, 2], 28: [44, 3],
                29: [47, 0], 30: [47, 2], 31: [47, 3],
                32: [50, 0], 33: [50, 2], 34: [50, 3],
                35: [53, 0], 36: [53, 2], 37: [53, 3],
                38: [56, 0], 39: [56, 1], 40: [56, 2], 41: [56, 3]
            };
            const KROKI_HUC_54 = {
                ...KROKI_HUC_46,
                47: [54, 3], 48: [54, 4], 49: [54, 0], 50: [54, 1],
                51: [57, 3], 52: [57, 4], 53: [57, 0], 54: [57, 1]
            };

            let harita = KROKI_HUC_46;
            if (aktifKapasiteTipi === 41) harita = KROKI_HUC_41;
            else if (aktifKapasiteTipi === 54) harita = KROKI_HUC_54;

            const isimSutunIdx = (aktifKapasiteTipi === 41) ? 6 : 7;
            const durakSutunIdx = (aktifKapasiteTipi === 41) ? 10 : 11;
            mevcutKoltukListesi = [];

            for (let no = 1; no <= aktifKapasiteTipi; no++) {
                let renkliMi = false;
                let hucreRenkCss = "";
                let rgbDegerleri = null;

                if (harita[no]) {
                    const [rIdx, cIdx] = harita[no];
                    const hucre = krokiSayfa.satirlar[rIdx]?.[cIdx];
                    if (hucre && hucre.renk) {
                        const r = hucre.renk.red ?? 1;
                        const g = hucre.renk.green ?? 1;
                        const b = hucre.renk.blue ?? 1;
                        if (r < 0.96 || g < 0.96 || b < 0.96) {
                            renkliMi = true;
                            const r255 = Math.round(r * 255);
                            const g255 = Math.round(g * 255);
                            const b255 = Math.round(b * 255);
                            hucreRenkCss = `rgb(${r255}, ${g255}, ${b255})`;
                            rgbDegerleri = { r: r255, g: g255, b: b255 };
                        }
                    }
                }

                const satirIdx = no + 6;
                const isim = String(krokiSayfa.satirlar[satirIdx]?.[isimSutunIdx]?.deger || '').trim();
                const durak = String(krokiSayfa.satirlar[satirIdx]?.[durakSutunIdx]?.deger || '').trim();
                const doluMu = (renkliMi || isim !== '');

                mevcutKoltukListesi.push({
                    no: no,
                    dolu: doluMu,
                    isim: isim || (renkliMi ? "Grup Kayıt" : ""),
                    durak: durak,
                    cinsiyet: doluMu ? (cinsiyetler[no] || 'E') : null,
                    gercekRenk: hucreRenkCss,
                    rgb: rgbDegerleri
                });
            }

            krokiyiCiz(mevcutKoltukListesi, aktifKapasiteTipi);
            bildirimGoster(`✅ "${data.baslik}" yüklendi.`, "#166534", "#f0fdf4", "#bbf7d0");

        } catch (err) {
            bildirimGoster(`❌ Hata: ${err.message}`, "#991b1b", "#fee2e2", "#fca5a5");
        }
    }

    function krokiyiCiz(koltuklar, kapasite) {
        const krokiAlani = document.getElementById("krokiAlani");
        krokiAlani.innerHTML = "";

        let bosSayisi = 0;
        koltuklar.forEach(k => { if (!k.dolu) bosSayisi++; });
        document.getElementById("koltukSayac").innerText = `${bosSayisi} Boş Koltuk`;

        if (kapasite === 41) {
            const siralama41 = [
                { sol: [1],   sag: [2, 3] },
                { sol: [4],   sag: [5, 6] },
                { sol: [7],   sag: [8, 9] },
                { sol: [10],  sag: [11, 12] },
                { sol: [13],  sag: [14, 15] },
                { sol: [16],  sag: [17, 18] },
                { sol: [19],  sag: [20, 21] },
                { sol: [22],  sag: 'kapi' },
                { sol: [23],  sag: [24, 25] },
                { sol: [26],  sag: [27, 28] },
                { sol: [29],  sag: [30, 31] },
                { sol: [32],  sag: [33, 34] },
                { sol: [35],  sag: [36, 37] },
                { arka: [38, 39, 40, 41] }
            ];

            siralama41.forEach(sira => {
                const rowDiv = document.createElement("div");
                if (sira.arka) {
                    rowDiv.style.display = "grid";
                    rowDiv.style.gridTemplateColumns = "1fr 1fr 1fr 1fr";
                    rowDiv.style.gap = "6px";
                    sira.arka.forEach(no => rowDiv.appendChild(butonUret(no, koltuklar)));
                } else {
                    rowDiv.style.display = "grid";
                    rowDiv.style.gridTemplateColumns = "1fr 24px 1fr 1fr";
                    rowDiv.style.gap = "6px";
                    rowDiv.style.alignItems = "center";
                    rowDiv.appendChild(butonUret(sira.sol[0], koltuklar));

                    const koridor = document.createElement("div");
                    koridor.style.textAlign = "center";
                    koridor.style.color = "#94a3b8";
                    koridor.innerText = sira.sag === 'kapi' ? "║" : "│";
                    rowDiv.appendChild(koridor);

                    if (sira.sag === 'kapi') {
                        const kapi = document.createElement("div");
                        kapi.className = "orta-kapi-blok";
                        kapi.innerHTML = `<span>🚪</span> <span>ORTA KAPI</span>`;
                        rowDiv.appendChild(kapi);
                    } else {
                        rowDiv.appendChild(butonUret(sira.sag[0], koltuklar));
                        rowDiv.appendChild(butonUret(sira.sag[1], koltuklar));
                    }
                }
                krokiAlani.appendChild(rowDiv);
            });
            return;
        }

        const siralama2x2 = [
            { sol: [1, 2],   sag: [3, 4] },
            { sol: [5, 6],   sag: [7, 8] },
            { sol: [9, 10],  sag: [11, 12] },
            { sol: [13, 14], sag: [15, 16] },
            { sol: [17, 18], sag: [19, 20] },
            { sol: [21, 22], sag: 'kapi' },
            { sol: [25, 26], sag: [23, 24] },
            { sol: [29, 30], sag: [27, 28] },
            { sol: [33, 34], sag: [31, 32] },
            { sol: [37, 38], sag: [35, 36] },
            { sol: [41, 42], sag: [39, 40] },
            { sol: [45, 46], sag: [43, 44] }
        ];

        if (kapasite === 54) {
            siralama2x2.push({ sol: [49, 50], sag: [47, 48] });
            siralama2x2.push({ sol: [53, 54], sag: [51, 52] });
        }

        siralama2x2.forEach(sira => {
            const rowDiv = document.createElement("div");
            rowDiv.style.display = "grid";
            rowDiv.style.gridTemplateColumns = "1fr 1fr 22px 1fr 1fr";
            rowDiv.style.gap = "6px";
            rowDiv.style.alignItems = "center";

            rowDiv.appendChild(butonUret(sira.sol[0], koltuklar));
            rowDiv.appendChild(butonUret(sira.sol[1], koltuklar));

            const koridor = document.createElement("div");
            koridor.style.textAlign = "center";
            koridor.style.color = "#94a3b8";
            koridor.innerText = sira.sag === 'kapi' ? "║" : "│";
            rowDiv.appendChild(koridor);

            if (sira.sag === 'kapi') {
                const kapi = document.createElement("div");
                kapi.className = "orta-kapi-blok";
                kapi.innerHTML = `<span>🚪</span> <span>ORTA KAPI</span>`;
                rowDiv.appendChild(kapi);
            } else {
                rowDiv.appendChild(butonUret(sira.sag[0], koltuklar));
                rowDiv.appendChild(butonUret(sira.sag[1], koltuklar));
            }

            krokiAlani.appendChild(rowDiv);
        });
    }

    function butonUret(kNo, koltuklar) {
        const kVeri = koltuklar.find(x => x.no === kNo);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.id = "btnKoltuk_" + kNo;
        btn.style.padding = "9px 0";
        btn.style.borderRadius = "7px";
        btn.style.fontWeight = "800";
        btn.style.fontSize = "12px";

        if (kVeri.dolu) {
            btn.style.cursor = "not-allowed";
            const infoText = `Koltuk ${kNo}: ${kVeri.isim}${kVeri.durak ? ' | Durak: ' + kVeri.durak : ''}`;
            btn.title = infoText;

            if (kVeri.gercekRenk && kVeri.rgb) {
                btn.style.background = kVeri.gercekRenk;
                btn.style.border = "1.5px solid rgba(0,0,0,0.18)";
                const parlaklik = (kVeri.rgb.r * 299 + kVeri.rgb.g * 587 + kVeri.rgb.b * 114) / 1000;
                btn.style.color = parlaklik > 140 ? "#0f172a" : "#ffffff";
            } else {
                btn.style.background = "#e2e8f0";
                btn.style.border = "1.5px solid #cbd5e1";
                btn.style.color = "#475569";
            }

            const cinsiyetIcon = kVeri.cinsiyet === 'K' ? '👩' : (kVeri.cinsiyet === 'E' ? '👨' : '🔒');
            btn.innerText = `${kNo} ${cinsiyetIcon}`;
        } else {
            const seciliMi = seciliKoltuklar.includes(kNo);
            if (seciliMi) {
                btn.style.background = "#2563eb";
                btn.style.color = "#ffffff";
                btn.style.border = "1.5px solid #1d4ed8";
            } else {
                btn.style.background = "#ffffff";
                btn.style.color = "#15803d";
                btn.style.border = "1.5px solid #86efac";
            }
            btn.style.cursor = "pointer";
            btn.innerText = String(kNo);
            btn.onclick = () => koltukTiklandi(kNo);
        }
        return btn;
    }

    function koltukTiklandi(kNo) {
        const idx = seciliKoltuklar.indexOf(kNo);
        if (idx > -1) {
            seciliKoltuklar.splice(idx, 1);
        } else {
            seciliKoltuklar.push(kNo);
            seciliKoltuklar.sort((a, b) => a - b);
        }

        mevcutKoltukListesi.forEach(k => {
            if (!k.dolu) {
                const b = document.getElementById("btnKoltuk_" + k.no);
                if (b) {
                    if (seciliKoltuklar.includes(k.no)) {
                        b.style.background = "#2563eb";
                        b.style.color = "#ffffff";
                        b.style.borderColor = "#1d4ed8";
                    } else {
                        b.style.background = "#ffffff";
                        b.style.color = "#15803d";
                        b.style.borderColor = "#86efac";
                    }
                }
            }
        });

        yolcuFormunuYenile();
    }

    function secimleriTemizle() {
        seciliKoltuklar = [];
        mevcutKoltukListesi.forEach(k => {
            if (!k.dolu) {
                const b = document.getElementById("btnKoltuk_" + k.no);
                if (b) {
                    b.style.background = "#ffffff";
                    b.style.color = "#15803d";
                    b.style.borderColor = "#86efac";
                }
            }
        });
        yolcuFormunuYenile();
    }

    function yolcuFormunuYenile() {
        const container = document.getElementById("yolcuListesiFormu");
        const btnKaydet = document.getElementById("btnKaydet");
        const sayac = document.getElementById("seciliSayac");

        sayac.innerText = seciliKoltuklar.length;
        btnKaydet.disabled = (seciliKoltuklar.length === 0);

        if (seciliKoltuklar.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:30px 10px; color:#94a3b8; font-size:13px;">
                Henüz koltuk seçilmedi. Soldaki şemadan boş koltuklara tıklayın.
            </div>`;
            return;
        }

        container.innerHTML = "";

        seciliKoltuklar.forEach((kNo, index) => {
            const card = document.createElement("div");
            card.className = "passenger-card";
            card.innerHTML = `
                <div class="passenger-card-header">
                    <span>💺 Koltuk No: ${kNo} (${index + 1}. Yolcu)</span>
                    <button type="button" onclick="koltukTiklandi(${kNo})" style="background:none; border:none; color:#ef4444; font-weight:bold; cursor:pointer;">✖ Kaldır</button>
                </div>
                
                <!-- Satır 1: Ad Soyad & Cinsiyet -->
                <div style="display:grid; grid-template-columns: 2fr 1fr; gap:8px; margin-bottom:8px;">
                    <div>
                        <label style="font-size:11px; font-weight:700; color:#64748b; margin-bottom:2px; display:block;">Yolcu Adı Soyadı:</label>
                        <input type="text" id="ad_${kNo}" placeholder="Örn: Selçuk Üstün" style="font-weight:600;">
                    </div>
                    <div>
                        <label style="font-size:11px; font-weight:700; color:#64748b; margin-bottom:2px; display:block;">Cinsiyet:</label>
                        <select id="cins_${kNo}">
                            <option value="E">👨 Erkek</option>
                            <option value="K">👩 Kadın</option>
                        </select>
                    </div>
                </div>

                <!-- Satır 2: T.C. Kimlik & Doğum Tarihi (Opsiyonel) -->
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:8px;">
                    <div>
                        <label style="font-size:11px; font-weight:700; color:#64748b; margin-bottom:2px; display:block;">T.C. Kimlik / Pasaport:</label>
                        <input type="text" id="tc_${kNo}" maxlength="11" placeholder="11 Haneli T.C.">
                    </div>
                    <div>
                        <label style="font-size:11px; font-weight:700; color:#64748b; margin-bottom:2px; display:block;">Doğum Tarihi (Opsiyonel):</label>
                        <input type="text" id="dogum_${kNo}" placeholder="GG.AA.YYYY">
                    </div>
                </div>

                <!-- Satır 3: Telefon & Biniş Durağı -->
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <div>
                        <label style="font-size:11px; font-weight:700; color:#64748b; margin-bottom:2px; display:block;">Telefon Numarası:</label>
                        <input type="text" id="tel_${kNo}" placeholder="0532..." value="">
                    </div>
                    <div>
                        <label style="font-size:11px; font-weight:700; color:#64748b; margin-bottom:2px; display:block;">Biniş Durağı:</label>
                        <select id="durak_${kNo}">
                            <option value="Mersin - Vipol">Mersin - Vipol</option>
                            <option value="Mersin - Forum">Mersin - Forum</option>
                            <option value="Mersin - Eski Devlet Hastanesi">Mersin - Eski Devlet Hastanesi</option>
                            <option value="Tarsus - Ofis" selected>Tarsus - Ofis</option>
                            <option value="Tarsus - Madame Home">Tarsus - Madame Home</option>
                            <option value="Tarsus - Cengiz Topel">Tarsus - Cengiz Topel</option>
                            <option value="Tarsus - Kleopatra">Tarsus - Kleopatra</option>
                            <option value="Adana - Duygu Kafe">Adana - Duygu Kafe</option>
                        </select>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function topluDurakUygula() {
        const secilen = document.getElementById("topluDurakSecici").value;
        if (!secilen) return;
        seciliKoltuklar.forEach(kNo => {
            const el = document.getElementById(`durak_${kNo}`);
            if (el) el.value = secilen;
        });
    }

    function topluTelUygula() {
        const val = document.getElementById("topluTelInput").value;
        seciliKoltuklar.forEach(kNo => {
            const el = document.getElementById(`tel_${kNo}`);
            if (el) el.value = val;
        });
    }

    async function grubuKaydet() {
        if (!aktifDosyaId || seciliKoltuklar.length === 0) return;

        const yolcular = [];
        for (const kNo of seciliKoltuklar) {
            const ad = document.getElementById(`ad_${kNo}`)?.value.trim();
            if (!ad) {
                alert(`Lütfen Koltuk ${kNo} için yolcu adı girin!`);
                document.getElementById(`ad_${kNo}`)?.focus();
                return;
            }
            yolcular.push({
                koltuk_no: kNo,
                ad_soyad: ad,
                cinsiyet: document.getElementById(`cins_${kNo}`)?.value || 'E',
                tc_kimlik: document.getElementById(`tc_${kNo}`)?.value.trim() || '',
                dogum_tarihi: document.getElementById(`dogum_${kNo}`)?.value.trim() || '',
                telefon: document.getElementById(`tel_${kNo}`)?.value.trim() || '-',
                binis_duragi: document.getElementById(`durak_${kNo}`)?.value || ''
            });
        }

        const btn = document.getElementById("btnKaydet");
        btn.disabled = true;
        bildirimGoster(`⏳ ${yolcular.length} yolcu kaydediliyor...`, "#0369a1", "#eff6ff", "#bfdbfe");

        try {
            const res = await fetch(`${API_BASE}/api/grup-kaydet`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    dosya_id: aktifDosyaId,
                    kapasite: aktifKapasiteTipi,
                    yolcular: yolcular
                })
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.hata);

            bildirimGoster(`✅ Başarılı: ${data.mesaj}`, "#166534", "#f0fdf4", "#bbf7d0");

            seciliKoltuklar = [];
            yolcuFormunuYenile();
            turSecildi();

        } catch (err) {
            bildirimGoster(`❌ Kayıt Hatası: ${err.message}`, "#991b1b", "#fee2e2", "#fca5a5");
            btn.disabled = false;
        }
    }

    function bildirimGoster(mesaj, renk, arkaplan, kenarlik) {
        const durum = document.getElementById("durumKutusu");
        durum.style.display = "block";
        durum.style.color = renk;
        durum.style.background = arkaplan;
        durum.style.border = "1px solid " + kenarlik;
        durum.innerHTML = mesaj;
    }

    document.addEventListener("DOMContentLoaded", turlariYukle);
</script>

</body>
</html>
