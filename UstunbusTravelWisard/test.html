<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sadece Liste Çekme Testi</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #f1f5f9; }
        .box { background: white; padding: 20px; border-radius: 8px; max-width: 600px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { padding: 10px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        ul { margin-top: 20px; padding-left: 20px; }
        li { padding: 6px 0; border-bottom: 1px solid #eee; }
        .durum { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>📁 Drive Klasör Listesi Testi</h2>
    <p>Hedef: Sadece klasördeki dosyaların adını getirmek.</p>
    
    <button onclick="dosyalariGetir()">🚀 Klasörü Tara ve Listele</button>
    
    <div id="durum" class="durum">Bekleniyor...</div>
    <ul id="dosyaListesi"></ul>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw6u2YRyvbRbBwt84ovzi5oSBypsoHvGmsdnukwyVa4Nud5CRXsYltb9XgZ0ODfvMyM/exec";

    function dosyalariGetir() {
        const durum = document.getElementById("durum");
        const liste = document.getElementById("dosyaListesi");
        durum.style.color = "blue";
        durum.innerText = "⏳ Drive klasörü sorgulanıyor...";
        liste.innerHTML = "";

        // Tarayıcı güvenlik engeline (CORS) takılmayan en saf yöntem: Dinamik Script Çağrısı
        const benzersizFonksiyonAdi = "googleDriveSonuc_" + Math.round(Math.random() * 100000);
        
        window[benzersizFonksiyonAdi] = function(veri) {
            // Çağrı tamamlandı, geçici fonksiyonu temizle
            delete window[benzersizFonksiyonAdi];
            scriptTag.remove();

            if (veri.success) {
                durum.style.color = "green";
                durum.innerText = `✅ Başarılı! Toplam ${veri.toplam} dosya bulundu.`;

                veri.dosyalar.forEach(dosya => {
                    const li = document.createElement("li");
                    li.innerHTML = `📄 <strong>${dosya.ad}</strong> <br><small style="color:#666;">ID: ${dosya.id}</small>`;
                    liste.appendChild(li);
                });
            } else {
                durum.style.color = "red";
                durum.innerText = "❌ Hata: " + veri.hata;
            }
        };

        const scriptTag = document.createElement("script");
        scriptTag.src = `${API_URL}?callback=${benzersizFonksiyonAdi}&t=${Date.now()}`;
        scriptTag.onerror = function() {
            durum.style.color = "red";
            durum.innerText = "❌ Tarayıcı scripti yükleyemedi. Apps Script izinlerini veya internet bağlantınızı kontrol edin.";
            delete window[benzersizFonksiyonAdi];
            scriptTag.remove();
        };

        document.body.appendChild(scriptTag);
    }
</script>

</body>
</html>
