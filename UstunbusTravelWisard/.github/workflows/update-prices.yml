name: Günlük Akaryakıt Fiyat Güncelleyici

on:
  schedule:
    - cron: '0 3 * * *' # Her gün Türkiye saati ile sabah 06:00'da çalışır
  workflow_dispatch: # İsteğe bağlı olarak GitHub panelinden elle tetikleme tuşu

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Kodların repoya geri yazılabilmesi için yetki
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Scripti Çalıştır
        run: python update_prices.py

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add prices.json
          git commit -m "Otomatik günlük akaryakıt fiyatları güncellendi" || exit 0
          git push
